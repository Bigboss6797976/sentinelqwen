<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="680" fill="#0a0e27"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f7931e" font-size="22" font-weight="bold">🛡️ SentinelQwen — System Architecture</text>
  <text x="450" y="58" text-anchor="middle" fill="#aaa" font-size="12">Track 4: Autopilot Agent · Qwen Cloud Global AI Hackathon 2026</text>

  <!-- ── Row 1: User Interfaces ── -->
  <rect x="30" y="80" width="840" height="80" rx="10" fill="#1a1f3a" stroke="#f7931e" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" fill="#f7931e" font-size="13" font-weight="bold">User Interfaces</text>
  <!-- Web -->
  <rect x="60" y="110" width="200" height="36" rx="8" fill="#2a2f5a"/>
  <text x="160" y="133" text-anchor="middle" fill="#fff" font-size="12">🌐 Web Dashboard (Flask)</text>
  <!-- Telegram -->
  <rect x="345" y="110" width="210" height="36" rx="8" fill="#2a2f5a"/>
  <text x="450" y="133" text-anchor="middle" fill="#fff" font-size="12">📱 Telegram Bot</text>
  <!-- REST API -->
  <rect x="638" y="110" width="192" height="36" rx="8" fill="#2a2f5a"/>
  <text x="734" y="133" text-anchor="middle" fill="#fff" font-size="12">🔌 REST API (JSON)</text>

  <!-- Arrow down to orchestrator -->
  <line x1="450" y1="160" x2="450" y2="188" stroke="#f7931e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Row 2: Orchestrator ── -->
  <rect x="200" y="190" width="500" height="56" rx="10" fill="#1a1f3a" stroke="#ff6b35" stroke-width="2"/>
  <text x="450" y="214" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="bold">🎯 Audit Orchestrator</text>
  <text x="450" y="234" text-anchor="middle" fill="#aaa" font-size="11">End-to-end workflow · Human-in-the-Loop checkpoints · Risk scoring</text>

  <!-- Arrows down to agents -->
  <line x1="160" y1="246" x2="120" y2="290" stroke="#f7931e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="246" x2="310" y2="290" stroke="#f7931e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="246" x2="590" y2="290" stroke="#f7931e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="246" x2="780" y2="290" stroke="#f7931e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Row 3: Agents ── -->
  <!-- Code Analyzer -->
  <rect x="30" y="290" width="172" height="80" rx="8" fill="#1a1f3a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="116" y="314" text-anchor="middle" fill="#4a90d9" font-size="12" font-weight="bold">🔬 Code Analyzer</text>
  <text x="116" y="332" text-anchor="middle" fill="#ccc" font-size="10">· Complexity metrics</text>
  <text x="116" y="348" text-anchor="middle" fill="#ccc" font-size="10">· Contract type detect</text>
  <text x="116" y="364" text-anchor="middle" fill="#ccc" font-size="10">· AI semantic analysis</text>

  <!-- Vuln Detector -->
  <rect x="224" y="290" width="172" height="80" rx="8" fill="#1a1f3a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="310" y="314" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="bold">🔍 Vuln Detector</text>
  <text x="310" y="332" text-anchor="middle" fill="#ccc" font-size="10">· Static (Slither)</text>
  <text x="310" y="348" text-anchor="middle" fill="#ccc" font-size="10">· Pattern matching</text>
  <text x="310" y="364" text-anchor="middle" fill="#ccc" font-size="10">· AI analysis (14+ types)</text>

  <!-- Fix Suggester -->
  <rect x="504" y="290" width="172" height="80" rx="8" fill="#1a1f3a" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="590" y="314" text-anchor="middle" fill="#2ecc71" font-size="12" font-weight="bold">🔧 Fix Suggester</text>
  <text x="590" y="332" text-anchor="middle" fill="#ccc" font-size="10">· AI fix generation</text>
  <text x="590" y="348" text-anchor="middle" fill="#ccc" font-size="10">· Secure code patches</text>
  <text x="590" y="364" text-anchor="middle" fill="#ccc" font-size="10">· Gas impact analysis</text>

  <!-- Report Generator -->
  <rect x="698" y="290" width="172" height="80" rx="8" fill="#1a1f3a" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="784" y="314" text-anchor="middle" fill="#9b59b6" font-size="12" font-weight="bold">📝 Report Generator</text>
  <text x="784" y="332" text-anchor="middle" fill="#ccc" font-size="10">· Professional reports</text>
  <text x="784" y="348" text-anchor="middle" fill="#ccc" font-size="10">· Risk scoring</text>
  <text x="784" y="364" text-anchor="middle" fill="#ccc" font-size="10">· Markdown / HTML</text>

  <!-- Arrows to memory -->
  <line x1="450" y1="370" x2="450" y2="408" stroke="#f7931e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Row 4: Memory ── -->
  <rect x="200" y="410" width="500" height="60" rx="10" fill="#1a1f3a" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450" y="434" text-anchor="middle" fill="#f39c12" font-size="13" font-weight="bold">🧠 Persistent Memory (ChromaDB Vector Store)</text>
  <text x="450" y="454" text-anchor="middle" fill="#ccc" font-size="11">Similar audit retrieval · Cross-session learning · 90-day auto-cleanup</text>

  <!-- Arrow to infra -->
  <line x1="450" y1="470" x2="450" y2="498" stroke="#f7931e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Row 5: Qwen Cloud ── -->
  <rect x="30" y="500" width="400" height="70" rx="10" fill="#1a1f3a" stroke="#f7931e" stroke-width="2"/>
  <text x="230" y="524" text-anchor="middle" fill="#f7931e" font-size="13" font-weight="bold">☁️ Qwen Cloud API (Qwen 3.7 Plus)</text>
  <text x="230" y="542" text-anchor="middle" fill="#ccc" font-size="11">Semantic analysis · Vulnerability detection</text>
  <text x="230" y="558" text-anchor="middle" fill="#ccc" font-size="11">Fix generation · 991K context window</text>

  <!-- ── Row 5: Alibaba Cloud ── -->
  <rect x="470" y="500" width="400" height="70" rx="10" fill="#1a1f3a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="670" y="524" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">🏗️ Alibaba Cloud Infrastructure</text>
  <text x="610" y="542" text-anchor="middle" fill="#ccc" font-size="11">ECS (Compute)</text>
  <text x="670" y="558" text-anchor="middle" fill="#ccc" font-size="11">OSS (Storage) · RDS (MySQL) · Redis</text>

  <!-- ── Legend ── -->
  <rect x="30" y="590" width="840" height="72" rx="8" fill="#111527" stroke="#333" stroke-width="1"/>
  <text x="50" y="610" fill="#f7931e" font-size="12" font-weight="bold">Detection Layers:</text>
  <rect x="50" y="618" width="10" height="10" fill="#e74c3c"/>
  <text x="68" y="628" fill="#ccc" font-size="11">Static Analysis (Slither/Mythril)</text>
  <rect x="260" y="618" width="10" height="10" fill="#f39c12"/>
  <text x="278" y="628" fill="#ccc" font-size="11">Pattern Matching (14+ vuln types)</text>
  <rect x="500" y="618" width="10" height="10" fill="#4a90d9"/>
  <text x="518" y="628" fill="#ccc" font-size="11">AI Semantic Analysis (Qwen 3.7)</text>

  <text x="50" y="652" fill="#aaa" font-size="11">Human-in-the-Loop checkpoints at: Critical findings → Fix approval → Final report sign-off</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f7931e"/>
    </marker>
  </defs>
</svg>
